{% extends "base.html" %}
{% block title %}ReconScope – Reports{% endblock %}
{% block content %}
<div class="rs-card p-4">
  <h5 class="rs-section">Reports</h5>
  {% if scans %}
  <table class="table rs-table align-middle mb-0">
    <thead><tr><th>ID</th><th>Domain</th><th>Date</th><th></th></tr></thead>
    <tbody>
    {% for s in scans %}
      <tr>
        <td>{{ s.id }}</td><td class="rs-value">{{ s.domain }}</td><td>{{ s.scan_date }}</td>
        <td><a class="btn btn-sm btn-outline-info" href="{{ url_for('report', scan_id=s.id) }}">View report</a></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="text-secondary mb-0">No scans yet.</p>
  {% endif %}
</div>
{% endblock %}
